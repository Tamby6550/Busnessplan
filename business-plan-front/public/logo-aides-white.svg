<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" role="img" aria-label="AIDES">
  <!-- Bar 1 -->
  <rect x="20" y="58" width="18" height="32" rx="2" fill="rgba(255,255,255,0.55)"/>
  <!-- Bar 2 -->
  <rect x="42" y="44" width="18" height="46" rx="2" fill="rgba(255,255,255,0.70)"/>
  <!-- Bar 3 (accent gold -> light in white mode) -->
  <rect x="64" y="28" width="18" height="62" rx="2" fill="rgba(253,216,53,0.85)"/>
  <!-- Bar 4 -->
  <rect x="86" y="50" width="18" height="40" rx="2" fill="rgba(255,255,255,0.55)"/>

  <!-- Swoosh -->
  <path d="M 18 75 Q 55 18 115 22" fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- AIDES text -->
  <text x="122" y="68" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="42" fill="white" letter-spacing="1">AIDES</text>

  <!-- Subtitle -->
  <text x="122" y="86" font-family="Arial, sans-serif" font-weight="400"
        font-size="11" fill="rgba(255,255,255,0.55)" letter-spacing="0.3">Appui aux Investissements Durables</text>
</svg>
