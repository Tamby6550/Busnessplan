; Réglages PHP-FPM spécifiques à ce site (LWS mutualisé).
; L'export Excel (toutes entreprises, colonnes détaillées) peut dépasser les
; 60 secondes et les 128 Mo par défaut — ce fichier relève ces limites au
; niveau du serveur, en complément de set_time_limit()/ini_set() dans le
; contrôleur (utile si ces fonctions sont désactivées via disable_functions).
; Un changement dans ce fichier peut prendre jusqu'à quelques minutes à être
; pris en compte (délai de cache PHP-FPM, "user_ini.cache_ttl").
max_execution_time = 300
memory_limit = 512M
